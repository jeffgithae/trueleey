# Local development stack: MySQL (VP + Beauty Express stand-in), backend API and a mail catcher.
# The frontend and admin apps run separately with `npm run serve` and call the API on :8001.
#
#   docker compose -f docker-compose.local.yml up -d --build
#   docker compose -f docker-compose.local.yml exec backend php artisan migrate --seed --force
#   docker compose -f docker-compose.local.yml exec backend php artisan migrate --force \
#       --database=be_mysql --path=database/migrations/beauty_express
#
# Code changes to the backend need a rebuild (`up -d --build`); the image copies the source in.

name: trueleey-local

services:

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: trueleey
      MYSQL_USER: trueleey
      MYSQL_PASSWORD: trueleey
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/mysql-init.sh:/docker-entrypoint-initdb.d/10-beauty-express.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8026:8025" # web UI for emails the backend sends (password resets, new orders)

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APT_SKIP_SECURITY: "1"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8001:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_LEVEL: debug
      # Local-only key; production sets its own APP_KEY.
      APP_KEY: base64:dHJ1ZWxlZXktbG9jYWwtZGV2LWtleS0zMmJ5dGVzISE=
      APP_URL: http://localhost:8001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: trueleey
      DB_USERNAME: trueleey
      DB_PASSWORD: trueleey
      BE_DB_HOST: mysql
      BE_DB_PORT: 3306
      BE_DB_DATABASE: beauty_express
      BE_DB_USERNAME: trueleey
      BE_DB_PASSWORD: trueleey
      BE_JWT_SECRET: local-dev-secret
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: "null"
      MAIL_FROM_ADDRESS: noreply@trueleey.local
      MAIL_FROM_NAME: Trueleey

volumes:
  mysql_data:
